name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Foundry (anvil)
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Resolve local profile (smoke)
        run: npm run resolve:local

  integration-fork:
    name: base-sepolia fork rehearsal
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Foundry (anvil)
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install dependencies
        run: npm ci

      - name: Rehearse the base-sepolia topology on a fork
        env:
          BASE_SEPOLIA_RPC_URL: ${{ secrets.BASE_SEPOLIA_RPC_URL }}
        run: |
          test -n "$BASE_SEPOLIA_RPC_URL" || { echo "BASE_SEPOLIA_RPC_URL secret not set"; exit 1; }
          npm run resolve:base-sepolia-fork
          npm run deploy:base-sepolia-fork
